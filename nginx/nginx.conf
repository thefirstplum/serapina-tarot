events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # 로그 설정
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;
    
    # 기본 설정
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    
    # 압축 설정
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;
    
    # 업스트림 백엔드 서버 (타로)
    upstream backend {
        server tarot_backend:8000;
    }


    # HTTP 서버 (포트 80)
    server {
        listen 80;
        server_name serapina.kr www.serapina.kr localhost _;

        # Let's Encrypt ACME 챌린지를 위한 경로
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 어드민 페이지 (Basic Auth 보호)
        location /admin {
            auth_basic "Serapina Admin";
            auth_basic_user_file /etc/nginx/.htpasswd;
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        # 어드민 API (Basic Auth 보호 + 백엔드 프록시)
        location /api/admin/ {
            auth_basic "Serapina Admin";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://backend/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 정적 파일 서빙 (Vue.js 프론트엔드)
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/index.html /index.html;

            # index.html은 캐시하지 않음 (항상 최신 버전 로드)
            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }

            # sw.js, manifest.json은 캐시하지 않음 (업데이트 즉시 반영)
            location ~ ^/(sw\.js|manifest\.json)$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }

            # 정적 파일 캐싱 (해시된 파일명은 안전하게 캐시)
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        # API 프록시 (백엔드로 전달)
        location /api/ {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 타임아웃 설정 (AI 해석이 오래 걸릴 수 있음)
            proxy_connect_timeout 60s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;

            # 스트리밍 지원
            proxy_buffering off;
            proxy_cache off;

            # CORS 헤더
            add_header Access-Control-Allow-Origin "https://serapina.kr";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization";

            # OPTIONS 요청 처리
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "https://serapina.kr";
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 200;
            }
        }

        # Sitemap.xml 동적 생성 (백엔드로 프록시)
        location = /sitemap.xml {
            proxy_pass http://backend/sitemap.xml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # XML 캐싱 설정 (1시간)
            add_header Cache-Control "public, max-age=3600";
            add_header Content-Type "application/xml";
        }

        # 직접 백엔드 프록시 (개발용 호환성)
        location ~ ^/(interpret|analyze_question|readings|save-reading)$ {
            proxy_pass http://backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 타임아웃 설정 (AI 해석이 오래 걸릴 수 있음)
            proxy_connect_timeout 60s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;

            # 스트리밍 지원
            proxy_buffering off;
            proxy_cache off;

            # CORS 헤더
            add_header Access-Control-Allow-Origin "https://serapina.kr";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization";

            # OPTIONS 요청 처리
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "https://serapina.kr";
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 200;
            }
        }

        # 보안 헤더
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 에러 페이지
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # HTTPS 서버 (포트 443)
    server {
        listen 443 ssl http2;
        server_name serapina.kr www.serapina.kr;

        # SSL 인증서 경로 (Let's Encrypt)
        ssl_certificate /etc/nginx/ssl/live/serapina.kr-0001/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/serapina.kr-0001/privkey.pem;

        # SSL 설정 (보안 강화)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # 어드민 페이지 (Basic Auth 보호)
        location /admin {
            auth_basic "Serapina Admin";
            auth_basic_user_file /etc/nginx/.htpasswd;
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        # 어드민 API (Basic Auth 보호 + 백엔드 프록시)
        location /api/admin/ {
            auth_basic "Serapina Admin";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://backend/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 정적 파일 서빙 (Vue.js 프론트엔드)
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/index.html /index.html;

            # index.html은 캐시하지 않음 (항상 최신 버전 로드)
            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }

            # sw.js, manifest.json은 캐시하지 않음 (업데이트 즉시 반영)
            location ~ ^/(sw\.js|manifest\.json)$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }

            # 정적 파일 캐싱 (해시된 파일명은 안전하게 캐시)
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        # API 프록시 (백엔드로 전달)
        location /api/ {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 타임아웃 설정 (AI 해석이 오래 걸릴 수 있음)
            proxy_connect_timeout 60s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;

            # 스트리밍 지원
            proxy_buffering off;
            proxy_cache off;

            # CORS 헤더
            add_header Access-Control-Allow-Origin "https://serapina.kr";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization";

            # OPTIONS 요청 처리
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "https://serapina.kr";
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 200;
            }
        }

        # Sitemap.xml 동적 생성 (백엔드로 프록시)
        location = /sitemap.xml {
            proxy_pass http://backend/sitemap.xml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # XML 캐싱 설정 (1시간)
            add_header Cache-Control "public, max-age=3600";
            add_header Content-Type "application/xml";
        }

        # 직접 백엔드 프록시 (개발용 호환성)
        location ~ ^/(interpret|analyze_question|readings|save-reading)$ {
            proxy_pass http://backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 타임아웃 설정 (AI 해석이 오래 걸릴 수 있음)
            proxy_connect_timeout 60s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;

            # 스트리밍 지원
            proxy_buffering off;
            proxy_cache off;

            # CORS 헤더
            add_header Access-Control-Allow-Origin "https://serapina.kr";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization";

            # OPTIONS 요청 처리
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "https://serapina.kr";
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 200;
            }
        }

        # 보안 헤더
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 에러 페이지
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
